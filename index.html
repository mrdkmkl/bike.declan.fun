<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bike.declan.fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eee7da;
    --dim:rgba(238,231,218,.5);
    --line:rgba(238,231,218,.14);
    --amber:#e0a458;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#04050a;
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    overflow-x:hidden;
    position:relative;
  }

  #stars{position:fixed;inset:0;z-index:0;}
  #stars canvas{position:absolute;inset:0;width:100%;height:100%;}
  #vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%);}

  .stage{
    position:relative;
    z-index:3;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:clamp(20px,4vw,58px);
  }

  .brand{font-size:12px;letter-spacing:.05em;color:var(--dim);}

  .hero{display:flex;align-items:center;flex:1;min-height:0;}
  .clock{display:flex;gap:clamp(18px,3vw,34px);position:relative;z-index:4;}
  .clock .unit{display:flex;flex-direction:column;align-items:flex-start;}
  .clock .num{
    font-family:'JetBrains Mono',monospace;
    font-weight:500;
    font-size:clamp(2.6rem,7vw,4.6rem);
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .clock .label{margin-top:8px;font-size:11px;color:var(--dim);letter-spacing:.02em;}

  .globe-wrap{
    position:absolute;
    top:50%;
    right:-18vw;
    transform:translateY(-50%);
    width:min(58vw,720px);
    height:min(58vw,720px);
    z-index:2;
    pointer-events:none;
    filter:drop-shadow(0 0 60px rgba(90,130,180,.25));
  }
  .globe-wrap canvas{width:100% !important;height:100% !important;display:block;position:absolute;inset:0;}

  .teaser{position:relative;z-index:4;display:flex;justify-content:flex-start;}
  .teaser a{
    color:var(--ink);
    text-decoration:none;
    font-size:12px;
    letter-spacing:.03em;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding-bottom:2px;
    border-bottom:1px solid var(--line);
    transition:border-color .3s ease, color .3s ease;
  }
  .teaser a:hover{border-color:var(--amber);color:var(--amber);}
  .teaser a svg{width:11px;height:11px;flex:none;}

  @media (max-width:760px){
    .stage{padding:20px;gap:22px;}
    .hero{justify-content:center;}
    .clock{gap:16px;flex-wrap:wrap;}
    .clock .num{font-size:clamp(2.3rem,11vw,3.2rem);}
    .globe-wrap{
      position:relative;top:auto;right:auto;transform:none;
      width:82vw;height:82vw;margin:6vh auto -26vw;
    }
    .teaser{justify-content:center;margin-top:8vw;}
  }

  @media (prefers-reduced-motion: reduce){.globe-wrap{filter:none;}}

  .teaser{justify-content:space-between !important;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .ea-btn{
    font-family:inherit;font-size:12px;letter-spacing:.03em;color:var(--ink);
    background:rgba(238,231,218,.04);border:1px solid var(--line);border-radius:999px;
    padding:10px 18px;cursor:pointer;transition:border-color .3s ease,color .3s ease,background .3s ease;
  }
  .ea-btn:hover{border-color:var(--amber);color:var(--amber);background:rgba(224,164,88,.06);}
  #eaBtn{background:var(--amber);border-color:var(--amber);color:#14100a;font-weight:500;}
  #eaBtn:hover,#eaBtn:active{background:#ecb670;border-color:#ecb670;color:#14100a;}
  #eaGo{background:var(--amber);border-color:var(--amber);color:#14100a;font-weight:500;}
  #eaGo:disabled{opacity:.6;}
  .ea-btn{min-height:44px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  body.lock{overflow:hidden;}
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(2,3,8,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px;}
  .modal.open{display:flex;}
  .modal-card{width:min(360px,100%);background:#0b0d14;border:1px solid var(--line);border-radius:14px;padding:26px;}
  .modal-card h2{margin:0 0 6px;font-size:14px;font-weight:500;letter-spacing:.03em;}
  .modal-card p{margin:0 0 18px;font-size:11px;color:var(--dim);}
  .modal-card input{
    width:100%;font-family:inherit;font-size:20px;letter-spacing:.35em;text-align:center;color:var(--ink);
    background:transparent;border:1px solid var(--line);border-radius:8px;padding:12px;outline:none;
  }
  .modal-card input:focus{border-color:var(--amber);}
  .modal-err{height:16px;margin-top:10px;font-size:11px;color:#e07a6a;text-align:center;}
  .modal-row{display:flex;gap:10px;margin-top:8px;}
  .modal-row button{flex:1;}
  .shake{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .modal-card input{font-size:20px;}
  .stage{min-height:100vh;min-height:100dvh;}
  @media (max-width:760px){
    .stage{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));}
    .teaser{flex-direction:column-reverse;align-items:stretch !important;gap:14px;}
    #eaBtn{width:100%;font-size:14px;padding:14px 18px;}
    .teaser a{align-self:center;font-size:13px;padding:8px 0;}
    .brand{text-align:center;}
    .clock{justify-content:center;}
    .clock .unit{align-items:center;}
    .modal{align-items:flex-end;padding:0;}
    .modal-card{width:100%;border-radius:18px 18px 0 0;border-bottom:0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));}
    .modal-card input{font-size:22px;padding:14px;}
  }
</style>
</head>
<body>

<div id="stars"><canvas id="starCanvas"></canvas></div>
<div id="vignette"></div>

<div class="stage">
  <div class="brand">bike.declan.fun</div>

  <div class="hero">
    <div class="clock">
      <div class="unit"><span class="num" id="dd">00</span><span class="label">days</span></div>
      <div class="unit"><span class="num" id="hh">00</span><span class="label">hrs</span></div>
      <div class="unit"><span class="num" id="mm">00</span><span class="label">min</span></div>
      <div class="unit"><span class="num" id="ss">00</span><span class="label">sec</span></div>
    </div>

    <div class="globe-wrap" id="globeWrap" aria-hidden="true"></div>
  </div>

  <div class="teaser">
    <a href="https://youtu.be/re9ff387RNI" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      watch the teaser
    </a>
    <button class="ea-btn" id="eaBtn" type="button">early access link</button>
  </div>
</div>


<div class="modal" id="eaModal" role="dialog" aria-modal="true" aria-labelledby="eaTitle">
  <div class="modal-card" id="eaCard">
    <h2 id="eaTitle">early access</h2>
    <p>enter today's password</p>
    <input id="eaInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••••••">
    <div class="modal-err" id="eaErr"></div>
    <div class="modal-row">
      <button class="ea-btn" id="eaCancel" type="button">cancel</button>
      <button class="ea-btn" id="eaGo" type="button">enter</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ---------- countdown ----------
  var target = new Date('2026-12-31T00:00:00');
  function pad(n){return String(n).padStart(2,'0');}
  function tick(){
    var diff = Math.max(0, target - new Date());
    document.getElementById('dd').textContent = pad(Math.floor(diff/86400000));
    document.getElementById('hh').textContent = pad(Math.floor(diff%86400000/3600000));
    document.getElementById('mm').textContent = pad(Math.floor(diff%3600000/60000));
    document.getElementById('ss').textContent = pad(Math.floor(diff%60000/1000));
  }
  tick(); setInterval(tick, 1000);

  // ---------- starfield ----------
  (function(){
    var c = document.getElementById('starCanvas'), ctx = c.getContext('2d'), stars = [];
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function resize(){
      c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
      var count = Math.floor((innerWidth*innerHeight)/2600);
      stars = [];
      for(var i=0;i<count;i++){
        var tone = Math.random();
        stars.push({
          x: Math.random()*c.width, y: Math.random()*c.height,
          r: (Math.random()*Math.random()*1.6 + 0.3) * devicePixelRatio,
          p: Math.random()*Math.PI*2, s: Math.random()*0.012+0.004,
          c: tone<.7 ? '238,231,218' : (tone<.88 ? '160,190,230' : '224,164,88')
        });
      }
    }
    function draw(){
      ctx.clearRect(0,0,c.width,c.height);
      for(var i=0;i<stars.length;i++){
        var st = stars[i]; st.p += st.s;
        var a = reduced ? 0.75 : 0.35 + Math.sin(st.p)*0.45;
        ctx.beginPath();
        ctx.fillStyle = 'rgba('+st.c+','+(0.2+a*0.6)+')';
        ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    addEventListener('resize', resize); resize(); draw();
  })();

  // ---------- procedural earth: true lat/lon landmass outlines, shaded like real terrain ----------
  function rand(seed){ var x = Math.sin(seed*999)*10000; return x - Math.floor(x); }

    var moonTex = new THREE.TextureLoader().load(MOON_IMG);
    if(THREE.SRGBColorSpace) moonTex.colorSpace = THREE.SRGBColorSpace; else moonTex.encoding = THREE.sRGBEncoding;

    var earthMat = new THREE.MeshPhongMaterial({map:earthTex, shininess:10, specular:0x2a3d4d});
    var moonMat  = new THREE.MeshPhongMaterial({map:moonTex, shininess:2, specular:0x111111});
    var sphere = new THREE.Mesh(new THREE.SphereGeometry(1,64,64), earthMat);
    sphere.rotation.y = 3.6;
    scene.add(sphere);

    var atmos = new THREE.Mesh(
      new THREE.SphereGeometry(1.05,48,48),
      new THREE.MeshBasicMaterial({color:0x6fa8d0, transparent:true, opacity:0.07, side:THREE.BackSide})
    );
    scene.add(atmos);

    // night = 7pm to 6am local time -> moon; otherwise earth
    function isNight(){ var h = new Date().getHours(); return h >= 19 || h < 6; }
    function applyTime(){
      var night = isNight();
      sphere.material = night ? moonMat : earthMat;
      atmos.visible = !night;
    }
    applyTime(); setInterval(applyTime, 30000);

    scene.add(new THREE.AmbientLight(0x334455, 1.1));
    var sun = new THREE.DirectionalLight(0xffe9c8, 1.4); sun.position.set(-3,1.2,2); scene.add(sun);
    var rim = new THREE.DirectionalLight(0x3a6ea5, 0.5); rim.position.set(3,-1,-2); scene.add(rim);

    function onResize(){
      w = wrap.clientWidth; h = wrap.clientHeight;
      camera.aspect = w/h; camera.updateProjectionMatrix();
      renderer.setSize(w,h);
    }
    addEventListener('resize', onResize);

    function animate(){
      if(!reduced){ sphere.rotation.y += 0.0016; }
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function cat(a,b){ var r=new Uint8Array(a.length+b.length); r.set(a); r.set(b,a.length); return r; }
    function hex(u){ return Array.prototype.map.call(u,function(x){return ('0'+x.toString(16)).slice(-2);}).join(''); }


    // 20-char access token: 6 (time) + 4 (random) + 10 (signature). The game checks it on arrival.
    var SECRET=['63dac0a1','a55fd8aa','b0fc912d','01937b12'].join('');
    function makeToken(){
      var t=Math.floor(Date.now()/1000).toString(36); while(t.length<6) t='0'+t;
      var r=new Uint8Array(4); (window.crypto||window.msCrypto).getRandomValues(r);
      var n=''; for(var i=0;i<4;i++) n+=(r[i]%36).toString(36);
      var sig=hex(sha256(utf8(SECRET+'|'+t+'|'+n))).slice(0,10);
      return t+n+sig;
    }

    var ITER=20000;
    var TABLE=[{s:'bdf13',v:'2bbedb488b9da23c60f6aa966234d8b73fe3af5b7c81a3588f2f2e5e91c335f1',e:'a578f32e91d6ac96be78b93e3f58d93c'},
      {s:'bdf7932',v:'7c9d49f21b04798319bef8d65ef6f7e65cd5890fdf6916d9448cbcb547b860c6',e:'0a40c7d11c21cb6306b6bb2de017ddcf'},
      {s:'bdf15851',v:'db5ad4a36fdb95e9ff10a1b3908f05afa3a8c5e3ddd3706a71448f4e04964590',e:'52bcef9c72e09bfc5f3ef1af32585e7e'},
      {s:'bdf23770',v:'69375b763cd4ea8cdad1a35cda3764ad1aae0131648f6f9c45f4b393b84b5aa5',e:'a26bf528a679140174b154eeccf75ca8'},
      {s:'bdf31689',v:'20939f655f78abb36d4ff9bf4aa73d0f9618e4fead624cf91107b6b6835961a8',e:'a0a7d61605a7f7193506d904cad4d756'},
      {s:'bdf39608',v:'079de20b5737c256333b4631aa0fcf574876fb8d175f5e5bb469996788d4f205',e:'2b19d11bbd72d9ce55b7e58e28bed348'},
      {s:'bdf47527',v:'bfb46aed15e5ff879273955e9295d8bb276bc6cb0112e2004fbdf2461f40bfe8',e:'dd068021fc682959183411f8e00c6566'}]; // Sun..Sat

    function tryUnlock(pw){
      var r=TABLE[new Date().getDay()];
      var d=utf8(r.s+pw);
      for(var i=0;i<ITER;i++) d=sha256(d);
      if(hex(sha256(cat(d,utf8('v'))))!==r.v) return null;
      var ks=sha256(cat(d,utf8('k'))), out='';
      for(var j=0;j<r.e.length/2;j++) out+=String.fromCharCode(parseInt(r.e.substr(j*2,2),16)^ks[j%32]);
      return out;
    }

    var modal=document.getElementById('eaModal'), card=document.getElementById('eaCard'),
        input=document.getElementById('eaInput'), err=document.getElementById('eaErr'),
        go=document.getElementById('eaGo');
    function open(){ modal.classList.add('open'); document.body.classList.add('lock'); err.textContent=''; input.value=''; setTimeout(function(){input.focus();},60); }
    function close(){ modal.classList.remove('open'); document.body.classList.remove('lock'); input.blur(); }
    function submit(){
      var pw=input.value.replace(/\D/g,'');
      if(pw.length!==8){ fail(); return; }
      go.disabled=true; err.textContent='checking…';
      setTimeout(function(){
        var url=tryUnlock(pw); go.disabled=false;
        if(url){ window.location.href=url+'?key='+makeToken(); } else fail();
      },20);
    }
    function fail(){
      err.textContent='incorrect password'; input.value='';
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      input.focus();
    }
    document.getElementById('eaBtn').addEventListener('click', open);
    document.getElementById('eaCancel').addEventListener('click', close);
    go.addEventListener('click', submit);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
    modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
    addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
  })();
</script>
