<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notice</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #ffffff;
    color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  p {
    box-sizing: border-box;
    width: calc(100% - 3rem);
    max-width: 36rem;
    margin: 0;
    font-size: clamp(1.1rem, 2.6vw, 1.5rem);
    line-height: 1.75;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
</style>
</head>
<body>
  <p>Due to ongoing code leakage and the game’s large team of over 10 members, the servers will be unavailable until December 31, 2026.</p>
</body>
</html>
